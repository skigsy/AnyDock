name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release license and tag
        shell: bash
        run: |
          if ! test -s LICENSE || ! grep -Eq '^license = "(MIT|Apache-2\.0)"$' Cargo.toml; then
            echo "::error::BLOCKER: select MIT or Apache-2.0 and add LICENSE before publishing"
            exit 1
          fi
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version"

  checks:
    needs: license
    uses: ./.github/workflows/ci.yml

  packages:
    needs: [license, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Build and verify tagged archive
        shell: bash
        env:
          ANYDOCK_RELEASE_TAG: ${{ github.ref_name }}
          RUSTUP_TOOLCHAIN: stable
        run: node tools/package-anydock.mjs "${RUNNER_TEMP}/anydock-release" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: ${{ runner.temp }}/anydock-release/
          if-no-files-found: error

  publish:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: ${{ runner.temp }}/packages/
      - name: Assemble exact release assets
        shell: bash
        run: node tools/assemble-release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/release"
      - name: Publish tagged assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --verify-tag --title "AnyDock $GITHUB_REF_NAME" --generate-notes
