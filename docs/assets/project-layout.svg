<svg xmlns="http://www.w3.org/2000/svg" width="960" height="388" viewBox="0 0 960 388" role="img" aria-labelledby="title description">
  <title id="title">One AnyDock install for a folder of projects</title>
  <desc id="description">AnyDock and optional shared skills and roles serve two project folders. Both projects keep their own rules, runs, and decisions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#251e23"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="386" rx="23" fill="url(#bg)" stroke="#4b3a41" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="35" y="57" fill="#fff1e7" font-size="36" font-weight="700">One install. A workspace per project.</text>
    <rect x="35" y="84" width="890" height="103" rx="14" fill="#302427" stroke="#966957" stroke-width="2"/>
    <path d="M375 103v65" stroke="#765054" stroke-width="2"/>
    <text x="62" y="125" fill="#f6bd8a" font-size="26" font-weight="700">AnyDock</text>
    <text x="62" y="156" fill="#e2ccc0" font-size="23">One local executable</text>
    <text x="406" y="125" fill="#f6bd8a" font-size="26" font-weight="700">Shared library</text>
    <text x="406" y="156" fill="#e2ccc0" font-size="23">Optional skills and agent roles</text>
    <path d="M480 188v23H246v23m234-23h234v23m-474-7 6 7 6-7m456 0 6 7 6-7" fill="none" stroke="#d29069" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#1e1c22" stroke="#5e4a50" stroke-width="2">
      <rect x="35" y="238" width="422" height="115" rx="14"/>
      <rect x="503" y="238" width="422" height="115" rx="14"/>
    </g>
    <g fill="none" stroke="#f2b786" stroke-width="2.6" stroke-linejoin="round">
      <path d="M62 268h13l6 6h14v16H62z"/>
      <path d="M530 268h13l6 6h14v16h-33z"/>
    </g>
    <g fill="#fff1e7" font-weight="700" font-size="28">
      <text x="109" y="287">Project A</text>
      <text x="577" y="287">Project B</text>
    </g>
    <g fill="#decac1" font-size="23">
      <text x="62" y="326">Project rules, runs, and decisions</text>
      <text x="530" y="326">Project rules, runs, and decisions</text>
    </g>
  </g>
</svg>
