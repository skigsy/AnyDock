<svg xmlns="http://www.w3.org/2000/svg" width="960" height="391" viewBox="0 0 960 391" role="img" aria-labelledby="title description">
  <title id="title">Resume a budget review in a fresh session</title>
  <desc id="description">Actual command excerpts show a budget review and a fresh session with the same question and revision, cb6d29ca.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#251e23"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="389" rx="23" fill="url(#bg)" stroke="#4b3a41" stroke-width="2"/>
  <g fill="#17161b" stroke="#66505a" stroke-width="2">
    <rect x="29" y="28" width="902" height="147" rx="14"/>
    <rect x="29" y="216" width="902" height="147" rx="14"/>
  </g>
  <path d="M239 29v145m0 43v145" stroke="#58464e" stroke-width="2"/>
  <path d="M480 177v35m-8-9 8 9 8-9" fill="none" stroke="#e5a372" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#fff0e5" font-size="25" font-weight="700">
      <text x="50" y="76">First session</text>
      <text x="50" y="264">Fresh session</text>
    </g>
    <g fill="#d8c1b8" font-size="21">
      <text x="50" y="112">Stops for review</text>
      <text x="50" y="300">Resumes review</text>
    </g>
  </g>
  <g font-family="Consolas, Menlo, Liberation Mono, monospace" font-size="25">
    <g fill="#f5bc89">
      <text x="263" y="68">$ anydock review budget-note</text>
      <text x="263" y="256">$ anydock handoff budget-note</text>
      <text x="263" y="144">Revision: cb6d29ca…</text>
      <text x="263" y="332">Revision: cb6d29ca…</text>
    </g>
    <g fill="#fff1e7">
      <text x="263" y="109">Are these budget figures correct?</text>
      <text x="263" y="297">Are these budget figures correct?</text>
    </g>
  </g>
</svg>
