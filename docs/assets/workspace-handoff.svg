<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 265" width="1200" height="265" role="img" aria-labelledby="title description">
  <title id="title">What a fresh agent can pick up</title>
  <desc id="description">The same local workspace keeps the brief, stage contracts, editable outputs and exact review state between agent sessions.</desc>
