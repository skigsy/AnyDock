<svg xmlns="http://www.w3.org/2000/svg" width="960" height="296" viewBox="0 0 960 296" role="img" aria-labelledby="title description">
  <title id="title">AnyDock keeps your place</title>
  <desc id="description">An AnyDock project handoff shows the budget draft, the next step, and the decision waiting for review.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#2a2025"/>
      <stop offset="1" stop-color="#121217"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#d89e6d" stop-opacity=".17"/>
      <stop offset="1" stop-color="#d89e6d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#b29b91" opacity=".28"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="958" height="294" rx="23" fill="url(#bg)" stroke="#4b3a41" stroke-width="2"/>
  <rect x="456" y="24" width="480" height="248" rx="14" fill="url(#grid)"/>
  <ellipse cx="659" cy="146" rx="255" ry="135" fill="url(#glow)"/>
  <path d="M458 44v208M441 148h52m-16-15 16 15-16 15" fill="none" stroke="#95705f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="61" fill="#f0b986" font-size="19" font-weight="700" letter-spacing="2.6">LOCAL AI WORKSPACE</text>
    <text x="40" y="151" fill="#fff2e6" font-family="Georgia, Times New Roman, serif" font-size="83" letter-spacing="-3">Any<tspan fill="#f5b87e">Dock</tspan></text>
    <text x="44" y="211" fill="#f4e6dd" font-size="30">Pick up where you left off.</text>
    <text x="45" y="249" fill="#cdbab2" font-size="23">One prompt to set it up.</text>
  </g>
  <rect x="509" y="45" width="404" height="206" rx="17" fill="#17161b" stroke="#886252" stroke-width="2"/>
  <rect x="509" y="45" width="404" height="52" rx="17" fill="#2e2327"/>
  <path d="M510 97h402" stroke="#62474a" stroke-width="2"/>
  <path d="M537 66h12l5 5h13v13h-30z" fill="none" stroke="#f5b87e" stroke-width="2.5" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="582" y="80" fill="#f6dfce" font-size="24" font-weight="700">Project handoff</text>
    <text x="536" y="133" fill="#d1bdb4" font-size="23">Next step</text>
    <text x="536" y="171" fill="#fff2e6" font-size="32" font-weight="700">Review the draft</text>
    <text x="536" y="214" fill="#f5b87e" font-family="Consolas, Menlo, monospace" font-size="23">summary.md</text>
  </g>
  <circle cx="865" cy="203" r="18" fill="#46312c" stroke="#a77a61" stroke-width="2"/>
  <path d="M865 194v10m0 6v1" stroke="#ffcb9a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
